<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In &middot; Inventory & POS System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-mark">Ledger &middot; Stock &middot; Till</div>
      <h1 class="h3 fw-bold mt-1 mb-0" style="color:var(--ink-900)">Inventory & POS</h1>
      <p class="text-muted-label mt-1">Sign in to continue</p>
    </div>

    <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label text-muted-label">Email address</label>
        <input type="email" class="form-control" id="email" required placeholder="you@business.com">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label text-muted-label">Password</label>
        <input type="password" class="form-control" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-naira w-100 py-2 fw-semibold" id="loginBtn">
        Sign In
      </button>
    </form>

    <hr class="my-4">
    <div class="figure small text-center text-secondary mt-1">
      admin@possystem.com / Admin@12345
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/api.js"></script>
<script>
  // If already logged in, skip straight to the right dashboard
  (function redirectIfLoggedIn() {
    const user = Api.getUser();
    if (user && Api.getToken()) {
      const roleHome = { admin: 'dashboard-admin.html', manager: 'dashboard-manager.html', cashier: 'dashboard-cashier.html' };
      window.location.href = roleHome[user.role] || 'dashboard-cashier.html';
    }
  })();

  const params = new URLSearchParams(window.location.search);
  if (params.get('sessionExpired')) {
    const alertBox = document.getElementById('loginAlert');
    alertBox.textContent = 'Your session expired. Please sign in again.';
    alertBox.classList.remove('d-none');
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const alertBox = document.getElementById('loginAlert');
    const btn = document.getElementById('loginBtn');

    alertBox.classList.add('d-none');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const res = await Api.post('/auth/login', { email, password });
      Api.setSession(res.data);

      const roleHome = { admin: 'dashboard-admin.html', manager: 'dashboard-manager.html', cashier: 'dashboard-cashier.html' };
      window.location.href = roleHome[res.data.role] || 'dashboard-cashier.html';
    } catch (err) {
      alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
      alertBox.classList.remove('d-none');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
