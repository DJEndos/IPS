<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Till &middot; Inventory & POS System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar pos-navbar navbar-dark px-3">
  <span class="navbar-brand mb-0">Ledger<span class="tag">POS</span> &middot; Till</span>
  <div class="d-flex align-items-center gap-3">
    <span id="currentUserBadge" class="text-white small"></span>
    <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sign out</button>
  </div>
</nav>

<div class="container-fluid py-3">
  <div class="row g-3">

    <!-- Product search / grid -->
    <div class="col-lg-7">
      <div class="d-flex gap-2 mb-3">
        <input type="text" id="barcodeInput" class="form-control figure" placeholder="Scan barcode or type SKU, then press Enter" autofocus>
        <input type="text" id="searchInput" class="form-control" placeholder="Search product name...">
      </div>
      <div id="productGrid" class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-2"></div>
      <div id="productEmpty" class="text-center text-muted py-5 d-none">
        <i class="bi bi-search fs-1"></i>
        <p>No products found.</p>
      </div>
    </div>

    <!-- Cart -->
    <div class="col-lg-5">
      <div class="cart-panel p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold mb-0"><i class="bi bi-cart3"></i> Current Sale</h6>
          <button class="btn btn-sm btn-outline-danger" id="clearCartBtn"><i class="bi bi-x-circle"></i> Clear</button>
        </div>

        <div id="cartItems" style="max-height: 40vh; overflow-y: auto;">
          <p class="text-muted-label text-center py-4" id="cartEmptyMsg">Cart is empty — scan or tap a product to begin</p>
        </div>

        <div class="mt-3">
          <div class="d-flex justify-content-between small mb-1">
            <span>Subtotal</span><span id="sumSubtotal" class="figure">₦0.00</span>
          </div>
          <div class="d-flex justify-content-between small mb-1">
            <span>Tax</span><span id="sumTax" class="figure">₦0.00</span>
          </div>
          <div class="d-flex justify-content-between small mb-2">
            <span>Discount</span>
            <input type="number" id="discountInput" class="form-control form-control-sm figure text-end" style="width:100px" value="0" min="0">
          </div>
          <div class="d-flex justify-content-between receipt-total fw-bold fs-5">
            <span>TOTAL</span><span id="sumTotal" class="figure text-naira">₦0.00</span>
          </div>
        </div>

        <div class="mt-3">
          <label class="text-muted-label">Payment method</label>
          <select id="paymentMethod" class="form-select mb-2">
            <option value="cash">Cash</option>
            <option value="card">Card</option>
            <option value="transfer">Bank Transfer</option>
            <option value="paystack">Paystack</option>
            <option value="flutterwave">Flutterwave</option>
          </select>
          <label class="text-muted-label">Amount received</label>
          <input type="number" id="amountPaid" class="form-control figure mb-2" placeholder="0.00" min="0">
          <div class="d-flex justify-content-between small mb-3">
            <span>Change due</span><span id="changeDue" class="figure fw-bold">₦0.00</span>
          </div>

          <button class="btn btn-naira w-100 py-2 fw-semibold" id="checkoutBtn">
            <i class="bi bi-check2-circle"></i> Complete Sale
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Receipt Modal -->
<div class="modal fade" id="receiptModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center p-4">
        <i class="bi bi-check-circle-fill text-success fs-1"></i>
        <h5 class="mt-2">Sale Completed</h5>
        <p class="text-muted-label mb-3">Invoice <span id="invoiceNoText" class="figure"></span></p>
        <a id="viewReceiptBtn" href="#" target="_blank" class="btn btn-outline-navy w-100 mb-2">
          <i class="bi bi-receipt"></i> View / Print Receipt
        </a>
        <button class="btn btn-naira w-100" data-bs-dismiss="modal">New Sale</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/pos.js"></script>
</body>
</html>
